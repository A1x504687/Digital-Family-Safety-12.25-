<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="description" content="أمان الأسرة — مركز حماية رقمية متكامل للأسرة المصرية" />
<title>أمان الأسرة — FAMILY DIGITAL SAFETY CENTER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E" />
<style>
:root{
  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --font: "Segoe UI", Tahoma, "Noto Naskh Arabic", Arial, system-ui, -apple-system, sans-serif;
  --shadow-sm:0 2px 8px rgba(0,0,0,.12);
  --shadow:0 8px 24px rgba(0,0,0,.18);
  --shadow-lg:0 18px 44px rgba(0,0,0,.28);
  --transition:.22s ease;
  --sidebar-w:268px; --header-h:60px;
}
html[data-theme="dark"]{
  --bg:#070b14;--bg-2:#0b1220;--surface:#111a2e;--surface-2:#16203a;--surface-3:#1d2a4a;
  --border:#23304f;--border-2:#2c3b5e;--text:#eaf0ff;--text-2:#a9b4d0;--text-3:#6f7c9b;
  --primary:#3b82f6;--primary-2:#60a5fa;--primary-soft:rgba(59,130,246,.14);
  --accent:#22d3ee;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--danger-2:#f87171;--info:#8b5cf6;
  --grad:linear-gradient(135deg,#3b82f6 0%,#22d3ee 100%);
  --grad-danger:linear-gradient(135deg,#ef4444 0%,#f97316 100%);
  --grad-warn:linear-gradient(135deg,#f59e0b 0%,#eab308 100%);
  --grad-success:linear-gradient(135deg,#10b981 0%,#22d3ee 100%);
  --overlay:rgba(3,7,18,.72);
}
html[data-theme="light"]{
  --bg:#f4f7fb;--bg-2:#eef3fa;--surface:#ffffff;--surface-2:#f7faff;--surface-3:#eef3fb;
  --border:#e2e8f3;--border-2:#d3dcea;--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
  --primary:#2563eb;--primary-2:#3b82f6;--primary-soft:rgba(37,99,235,.10);
  --accent:#0891b2;--success:#059669;--warning:#d97706;--danger:#dc2626;--danger-2:#ef4444;--info:#7c3aed;
  --grad:linear-gradient(135deg,#2563eb 0%,#0891b2 100%);
  --grad-danger:linear-gradient(135deg,#dc2626 0%,#ea580c 100%);
  --grad-warn:linear-gradient(135deg,#d97706 0%,#ca8a04 100%);
  --grad-success:linear-gradient(135deg,#059669 0%,#0891b2 100%);
  --overlay:rgba(15,23,42,.5);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 18px 44px rgba(15,23,42,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65;font-size:15px;overflow-x:hidden;transition:background var(--transition),color var(--transition);min-height:100vh;background-attachment:fixed}
img,svg{max-width:100%;display:block}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--primary-2);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px}

#platform-bg-overlay{position:fixed;inset:0;background:var(--bg);opacity:0;z-index:-1;pointer-events:none;transition:opacity .3s}
#platform-bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;pointer-events:none}

.app-shell{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:var(--sidebar-w);background:var(--bg-2);border-left:1px solid var(--border);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;right:0;z-index:60;transition:transform var(--transition);overflow-y:auto;overscroll-behavior:contain}
html[dir="ltr"] .sidebar{right:auto;left:0}
.sidebar-brand{padding:14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-2);z-index:2}
.brand-logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;flex-shrink:0;overflow:hidden;cursor:pointer;user-select:none}
.brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.brand-text{flex:1;min-width:0}
.brand-text b{display:block;font-size:15px;line-height:1.2}
.brand-text span{font-size:10px;color:var(--text-3);letter-spacing:.6px}
.sidebar-close-btn{display:none;width:38px;height:38px;border-radius:11px;background:rgba(239,68,68,.14);color:var(--danger);font-size:16px;place-items:center;flex-shrink:0;border:1px solid rgba(239,68,68,.3)}
.sidebar-nav{padding:8px 8px 30px;flex:1}
.nav-section-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;padding:14px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:var(--text-2);font-size:14px;font-weight:500;transition:background var(--transition),color var(--transition);margin-bottom:2px;text-align:right;width:100%}
.nav-item .ni-ico{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-2);font-weight:700}
.nav-item.owner-badge{background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(234,179,8,.08));border:1px solid rgba(245,158,11,.35)}
.main-col{flex:1;margin-right:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
html[dir="ltr"] .main-col{margin-right:0;margin-left:var(--sidebar-w)}

.topbar{height:var(--header-h);background:rgba(11,18,32,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 10px;position:sticky;top:0;z-index:40}
html[data-theme="light"] .topbar{background:rgba(238,243,250,.85)}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--text-2);font-size:17px;transition:background var(--transition);position:relative;flex-shrink:0}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.icon-btn .badge-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--bg-2)}
.topbar-title{font-size:14.5px;font-weight:700;margin-right:4px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-spacer{flex:1}
.search-mini{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:0 10px;height:38px;min-width:180px;cursor:pointer}
.search-mini input{border:none;background:transparent;outline:none;width:100%;font-size:13.5px;cursor:pointer;color:var(--text-2)}
.search-kbd{font-size:10px;padding:2px 6px;border:1px solid var(--border);border-radius:6px;color:var(--text-3);background:var(--bg-2)}

.page-wrap{padding:20px 18px 100px;max-width:1200px;width:100%;margin:0 auto;animation:pageIn .3s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:18px}
.page-head h1{font-size:24px;font-weight:800;margin-bottom:6px;line-height:1.3}
.page-head p{color:var(--text-2);font-size:14px}

.subnav{display:flex;gap:6px;overflow-x:auto;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;scroll-behavior:smooth}
.subnav::-webkit-scrollbar{height:3px}
.subnav-btn{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;flex-shrink:0;border:1px solid transparent;transition:all .15s}
.subnav-btn.active{background:var(--primary-soft);color:var(--primary-2);border-color:var(--primary-soft)}

.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:transform var(--transition),border-color var(--transition),box-shadow var(--transition)}
.card.hover:hover{transform:translateY(-2px);border-color:var(--border-2);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card-h .ci{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:var(--primary-soft);color:var(--primary-2)}
.card-h h3{font-size:15px;font-weight:700;line-height:1.35}
.card-h p{font-size:12px;color:var(--text-3)}
.card p{color:var(--text-2);font-size:13.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:11px;font-weight:600;font-size:13.5px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);transition:transform .12s,background var(--transition);min-height:42px;line-height:1.3;text-decoration:none}
.btn:hover{background:var(--surface-3);text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);border:none;color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{background:var(--grad-danger);border:none;color:#fff}
.btn-success{background:var(--grad-success);border:none;color:#fff}
.btn-sm{padding:6px 12px;font-size:12.5px;min-height:34px;border-radius:9px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}

.input,.select,.textarea{width:100%;padding:11px 13px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:11px;font-size:14px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary)}
.textarea{min-height:110px;resize:vertical;font-family:inherit;line-height:1.6}
.label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600}
.form-row{margin-bottom:12px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.chip.success{background:rgba(16,185,129,.14);color:var(--success);border-color:rgba(16,185,129,.3)}
.chip.warn{background:rgba(245,158,11,.14);color:var(--warning);border-color:rgba(245,158,11,.3)}
.chip.danger{background:rgba(239,68,68,.14);color:var(--danger-2);border-color:rgba(239,68,68,.3)}
.chip.info{background:rgba(139,92,246,.14);color:var(--info);border-color:rgba(139,92,246,.3)}
.chip.local{background:rgba(34,211,238,.14);color:var(--accent);border-color:rgba(34,211,238,.3)}

.banner{padding:11px 14px;border-radius:11px;display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.6;border:1px solid;margin-bottom:14px}
.banner.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.25);color:var(--text-2)}
.banner.warn{background:rgba(245,158,11,.09);border-color:rgba(245,158,11,.28)}
.banner.danger{background:rgba(239,68,68,.09);border-color:rgba(239,68,68,.28)}
.banner.success{background:rgba(16,185,129,.09);border-color:rgba(16,185,129,.28)}
.banner.owner{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(234,179,8,.06));border-color:rgba(245,158,11,.4)}

.empty{text-align:center;padding:34px 18px;color:var(--text-3);border:1.5px dashed var(--border);border-radius:var(--radius)}
.empty .em-ico{font-size:36px;margin-bottom:10px;opacity:.6}
.empty h4{color:var(--text-2);margin-bottom:6px;font-size:14.5px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;gap:10px}
.kv:last-child{border-bottom:none}
.kv b{color:var(--text-2);font-weight:600;flex-shrink:0}
.kv span{word-break:break-word;text-align:left}

.score-ring{position:relative;width:130px;height:130px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .sr-label{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;text-align:center}
.score-ring .sr-label b{font-size:32px;font-weight:800;line-height:1;display:block}
.score-ring .sr-label span{font-size:10.5px;color:var(--text-3);display:block}

.sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:55;opacity:0;transition:opacity var(--transition)}
.sidebar-overlay.show{opacity:1}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(11,18,32,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
html[data-theme="light"] .bottom-nav{background:rgba(238,243,250,.92)}
.bottom-nav-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:11px;color:var(--text-3);font-size:10px;font-weight:600;min-height:50px}
.bn-item .bn-ico{font-size:19px}
.bn-item.active{color:var(--primary-2);background:var(--primary-soft)}

.modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px;opacity:0;pointer-events:none;transition:opacity var(--transition)}
.modal-backdrop.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:translateY(16px);transition:transform var(--transition)}
.modal-backdrop.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-head h3{font-size:16px;font-weight:700}
.modal-body{padding:18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}

.toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:92vw;width:max-content}
.toast{background:var(--surface);border:1px solid var(--border);border-right:4px solid var(--primary);padding:11px 15px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;animation:toastIn .28s ease;pointer-events:auto}
.toast.success{border-right-color:var(--success)}
.toast.error{border-right-color:var(--danger)}
.toast.warn{border-right-color:var(--warning)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

.divider{height:1px;background:var(--border);margin:14px 0}
.muted{color:var(--text-2)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all}
.list-plain{list-style:none}
.list-plain li{padding:8px 0;border-bottom:1px dashed var(--border);display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.6}
.list-plain li:last-child{border-bottom:none}
.list-plain li .bi{flex-shrink:0;font-size:15px;margin-top:1px}

.check-item{display:flex;align-items:flex-start;gap:10px;padding:11px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);margin-bottom:7px;cursor:pointer}
.check-item input[type="checkbox"]{width:19px;height:19px;margin-top:2px;flex-shrink:0;accent-color:var(--primary);cursor:pointer}
.check-item.done{opacity:.65}
.check-item.done .ci-t{text-decoration:line-through}
.ci-t{font-weight:600;font-size:13.5px;line-height:1.5}
.ci-d{color:var(--text-3);font-size:12px;margin-top:3px}

.steps{display:flex;flex-direction:column;gap:9px}
.step{display:flex;gap:11px;padding:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;align-items:flex-start}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;flex-shrink:0}
.step-txt{font-size:13.5px;line-height:1.6;padding-top:3px}

.timeline{position:relative;padding-right:24px}
.timeline:before{content:"";position:absolute;top:6px;bottom:6px;right:8px;width:2px;background:var(--border)}
html[dir="ltr"] .timeline{padding-right:0;padding-left:24px}
html[dir="ltr"] .timeline:before{right:auto;left:8px}
.tl-item{position:relative;margin-bottom:14px}
.tl-item:before{content:"";position:absolute;top:6px;right:-22px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid var(--bg)}
html[dir="ltr"] .tl-item:before{right:auto;left:-22px}
.tl-time{font-size:11px;color:var(--text-3);font-weight:600}
.tl-title{font-weight:700;font-size:13.5px;margin:2px 0}
.tl-desc{font-size:12.5px;color:var(--text-2)}

.acc-item{border:1px solid var(--border);border-radius:11px;margin-bottom:7px;overflow:hidden;background:var(--surface)}
.acc-head{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;font-size:14px;gap:10px}
.acc-head:hover{background:var(--surface-2)}
.acc-head .acc-arrow{transition:transform var(--transition);color:var(--text-3);flex-shrink:0}
.acc-item.open .acc-head .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc-item.open .acc-body{max-height:3000px}
.acc-body-inner{padding:0 15px 15px;color:var(--text-2);font-size:13.5px;line-height:1.7}

.pbar{height:7px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.pbar > span{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .35s}

.sev{display:flex;align-items:center;gap:9px;padding:13px;border-radius:11px;margin-bottom:12px;font-weight:700;font-size:14.5px}
.sev.low{background:rgba(16,185,129,.14);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.sev.med{background:rgba(245,158,11,.14);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
.sev.high{background:rgba(249,115,22,.14);color:#f97316;border:1px solid rgba(249,115,22,.3)}
.sev.crit{background:rgba(239,68,68,.14);color:var(--danger-2);border:1px solid rgba(239,68,68,.3)}
.sev.emergency{background:rgba(239,68,68,.2);color:#fff;border:2px solid var(--danger)}

.risk-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
.risk-low{background:rgba(16,185,129,.18);color:var(--success);border:1px solid rgba(16,185,129,.4)}
.risk-med{background:rgba(245,158,11,.18);color:var(--warning);border:1px solid rgba(245,158,11,.4)}
.risk-high{background:rgba(249,115,22,.18);color:#f97316;border:1px solid rgba(249,115,22,.4)}
.risk-crit{background:rgba(239,68,68,.18);color:var(--danger-2);border:1px solid rgba(239,68,68,.4)}
.risk-emergency{background:var(--grad-danger);color:#fff;border:none}

.fab-emg{position:fixed;bottom:82px;left:14px;z-index:45;width:56px;height:56px;border-radius:50%;background:var(--grad-danger);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 10px 26px rgba(239,68,68,.4)}
.fab-emg:active{transform:scale(.94)}

.cmdk-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:250;display:flex;align-items:flex-start;justify-content:center;padding:9vh 14px 14px;opacity:0;pointer-events:none;transition:opacity .18s}
.cmdk-backdrop.show{opacity:1;pointer-events:auto}
.cmdk{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow-lg);overflow:hidden}
.cmdk-input-wrap{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.cmdk-input{width:100%;background:transparent;border:none;outline:none;font-size:15px;font-weight:600}
.cmdk-list{max-height:50vh;overflow-y:auto;padding:7px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;cursor:pointer;font-size:13.5px}
.cmdk-item:hover,.cmdk-item.active{background:var(--surface-2)}
.cmdk-item .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-2);font-size:15px;flex-shrink:0}
.cmdk-foot{padding:8px 13px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);display:flex;gap:12px;flex-wrap:wrap}
.cmdk-foot kbd{border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--bg-2);font-family:inherit;font-size:10px}

.bootstrap-error{padding:16px;background:var(--surface);border:1px solid var(--danger);border-radius:12px;color:var(--danger-2);font-family:monospace;font-size:12px;white-space:pre-wrap}

.img-preview{max-width:100%;max-height:280px;border-radius:10px;margin:8px auto;display:block;border:1px solid var(--border)}
.ela-preview{image-rendering:pixelated;max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--border);margin:8px auto;display:block}
.bg-preview{width:100%;height:180px;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--border);margin:10px 0}

.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--primary-soft);color:var(--primary-2);flex-shrink:0;font-weight:700;border:2px solid var(--border)}

.source-cite{font-size:11px;color:var(--text-3);border-right:2px solid var(--primary-soft);padding-right:8px;margin-top:4px;display:block}

/* AI Chat bubbles */
.ai-msg{display:flex;gap:10px;margin-bottom:12px}
.ai-msg.user{flex-direction:row-reverse}
.ai-msg .bubble{padding:11px 14px;border-radius:14px;max-width:85%;font-size:14px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word}
.ai-msg.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot .bubble{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.ai-msg .who{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;flex-shrink:0;font-size:16px}
.ai-msg.user .who{background:var(--grad);color:#fff}
.ai-typing{display:inline-flex;gap:3px;padding:8px 12px}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:aiDot 1.2s infinite}
.ai-typing span:nth-child(2){animation-delay:.2s}
.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes aiDot{0%,80%,100%{opacity:.4;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.preset-btn{padding:12px 10px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;font-weight:600;text-align:right;transition:all .15s}
.preset-btn:hover{border-color:var(--primary);background:var(--primary-soft)}

.media-upload-box{padding:20px;border:2px dashed var(--border);border-radius:14px;text-align:center;cursor:pointer;transition:all .2s}
.media-upload-box:hover{border-color:var(--primary);background:var(--primary-soft)}

/* ===================== MEDIA STORE (IndexedDB) ===================== */
var MediaStore = (function () {
  var DB_NAME = "aman_media_v1";
  var STORE = "media";
  var db = null;
  var memFallback = {};
  var available = !!window.indexedDB;
  function open() {
    return new Promise(function (resolve, reject) {
      if (db) return resolve(db);
      if (!available) return reject(new Error("unavailable"));
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess = function (e) { db = e.target.result; resolve(db); };
      req.onerror = function () { available = false; reject(req.error); };
    });
  }
  function set(key, blob) {
    return open().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(STORE, "readwrite");
        var st = tx.objectStore(STORE);
        var req = st.put(blob, key);
        req.onsuccess = function () { resolve(true); };
        req.onerror = function () { reject(req.error); };
      });
    }).catch(function () { memFallback[key] = blob; return true; });
  }
  function get(key) {
    return open().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(STORE, "readonly");
        var st = tx.objectStore(STORE);
        var req = st.get(key);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { reject(req.error); };
      });
    }).catch(function () { return memFallback[key] || null; });
  }
  function del(key) {
    return open().then(function (d) {
      return new Promise(function (resolve) {
        var tx = d.transaction(STORE, "readwrite");
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = function () { resolve(true); };
      });
    }).catch(function () { delete memFallback[key]; return true; });
  }
  return { set: set, get: get, del: del, isAvailable: function () { return available; } };
})();

          el.appendChild(img);
        });
      }
    });
  }
  // Background

  var existingVideo = document.getElementById("platform-bg-video");
  if (b.bgEnabled === false) {
    document.body.style.backgroundImage = "";
    if (existingVideo) existingVideo.remove();
    if (overlay) overlay.style.opacity = "0";
    return;
  }
  MediaStore.get("bg").then(function (blob) {
    if (!blob) return;
    var url = URL.createObjectURL(blob);
    var opacity = typeof b.bgOpacity === "number" ? b.bgOpacity : 0.55;

      document.body.style.backgroundImage = "";

      if (!v) {
        v = document.createElement("video");
        v.id = "platform-bg-video";
        v.autoplay = true;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;

        document.body.insertBefore(v, document.body.firstChild);
      }

      v.src = url;

    } else {
      if (existingVideo) existingVideo.remove();
      document.body.style.backgroundImage = "url(" + url + ")";
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = b.bgPosition || "center";
      document.body.style.backgroundAttachment = "fixed";
      // Overlay controls readability: 0.55 opacity image -> overlay 0.45
      if (overlay) overlay.style.opacity = String(Math.max(0, Math.min(0.9, 1 - opacity)));
    }
  });
}

function analyzeLinkLocal(url) {
  var findings = []; var score = 0;
  var u = (url || "").trim();
  if (!u) return { ok: false, error: "الرجاء إدخال رابط." };
  var parsed;
  try { parsed = new URL(/^https?:\/\//i.test(u) ? u : "http://" + u); } catch (e) { return { ok: false, error: "تعذّر التحليل." }; }
  var host = parsed.hostname, full = parsed.href;
  if (parsed.protocol === "https:") findings.push({ level: "good", txt: "الرابط يستخدم HTTPS." });
  else { findings.push({ level: "warn", txt: "لا يستخدم HTTPS." }); score += 2; }
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) { findings.push({ level: "danger", txt: "يستخدم IP بدل اسم نطاق." }); score += 3; }
  if (host.indexOf("xn--") === 0 || host.indexOf(".xn--") >= 0) { findings.push({ level: "warn", txt: "Punycode/IDN." }); score += 3; }
  var shorts = ["bit.ly","tinyurl.com","t.co","goo.gl","ow.ly","is.gd","buff.ly","rebrand.ly","cutt.ly","shorturl.at","rb.gy"];
  for (var i = 0; i < shorts.length; i++) if (host === shorts[i] || host.indexOf("." + shorts[i]) >= 0) { findings.push({ level: "warn", txt: "خدمة اختصار روابط." }); score += 2; break; }
  var susWords = ["login","verify","account","secure","update","confirm","bank","wallet","prize","winner","free","gift","urgent","signin","password","otp","recover","unlock"];
  var lc = full.toLowerCase(); var hits = [];
  for (var j = 0; j < susWords.length; j++) if (lc.indexOf(susWords[j]) >= 0) hits.push(susWords[j]);
  if (hits.length) { findings.push({ level: "warn", txt: "كلمات مريبة: " + hits.slice(0,4).join(", ") }); score += Math.min(hits.length, 3); }
  if (full.indexOf("@") >= 0 && full.indexOf("mailto:") !== 0) { findings.push({ level: "danger", txt: "يحتوي الرمز @." }); score += 3; }
  if (full.length > 100) { findings.push({ level: "warn", txt: "طويل (" + full.length + ")." }); score += 1; }
  if (host.split(".").length > 4) { findings.push({ level: "warn", txt: "نطاقات فرعية كثيرة." }); score += 1; }
  var susTlds = [".tk",".ml",".ga",".cf",".gq",".xyz",".top",".click",".work",".loan",".review"];
  for (var k = 0; k < susTlds.length; k++) if (host.indexOf(susTlds[k], host.length - susTlds[k].length) !== -1) { findings.push({ level: "warn", txt: "امتداد مريب: " + susTlds[k] }); score += 2; break; }
  if (!findings.length) findings.push({ level: "good", txt: "لا تظهر مؤشرات تقنية مريبة." });
  var verdict = "low";
  if (score >= 6) verdict = "crit"; else if (score >= 4) verdict = "high"; else if (score >= 2) verdict = "med";
  return { ok: true, url: full, host: host, findings: findings, score: score, verdict: verdict };
}

function luhnCheck(num) {

function generatePassword(opts) {
  var chars = "";
  if (opts.upper) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  if (opts.symbols) chars += "!@#$%^&*()-_=+[]{}<>?~";
  if (!chars) chars = "abcdefghijklmnopqrstuvwxyz";
  var len = opts.length || 16; var out = "";
  var arr = new Uint32Array(len);

  else for (var i = 0; i < len; i++) arr[i] = Math.floor(Math.random() * 1e9);

function estimateStrength(pwd) {
  if (!pwd) return { score: 0, label: "—", color: "var(--text-3)", entropy: 0, crack: "—", notes: [] };
  var notes = []; var poolSize = 0;
  if (/[a-z]/.test(pwd)) poolSize += 26; else notes.push("لا أحرف صغيرة");
  if (/[A-Z]/.test(pwd)) poolSize += 26; else notes.push("لا أحرف كبيرة");
  if (/[0-9]/.test(pwd)) poolSize += 10; else notes.push("لا أرقام");
  if (/[^A-Za-z0-9]/.test(pwd)) poolSize += 32; else notes.push("لا رموز");
  if (pwd.length < 12) notes.push("أقل من 12 حرفًا");
  if (/(012|123|1234|12345|abc|qwerty|password|admin|111)/i.test(pwd)) notes.push("نمط شائع");
  var entropy = poolSize > 0 ? pwd.length * Math.log2(poolSize) : 0;
  var score = entropy < 28 ? 1 : entropy < 40 ? 2 : entropy < 60 ? 3 : entropy < 80 ? 4 : 5;
  var label, color;
  if (score <= 1) { label = "ضعيفة جدًا"; color = "var(--danger)"; }
  else if (score === 2) { label = "ضعيفة"; color = "var(--danger-2)"; }
  else if (score === 3) { label = "متوسطة"; color = "var(--warning)"; }
  else if (score === 4) { label = "قوية"; color = "var(--success)"; }
  else { label = "قوية جدًا"; color = "var(--accent)"; }
  var combinations = Math.pow(2, entropy);
  var seconds = combinations / 1e10;
  var crack;
  if (seconds < 1) crack = "أقل من ثانية";
  else if (seconds < 60) crack = Math.round(seconds) + " ثانية";
  else if (seconds < 3600) crack = Math.round(seconds/60) + " دقيقة";
  else if (seconds < 86400) crack = Math.round(seconds/3600) + " ساعة";
  else if (seconds < 31536000) crack = Math.round(seconds/86400) + " يوم";
  else if (seconds < 31536000*100) crack = Math.round(seconds/31536000) + " سنة";
  else crack = "أكثر من مليون سنة";
  return { score: score, label: label, color: color, entropy: entropy, crack: crack, notes: notes };
}

function parseImageMetadata(buffer) {
  return new Promise(function (resolve) {
    var result = { exif: {}, chunks: [], dimensions: null, format: null, hasMetadata: false, hasC2PA: false };
    try {
      var view = new DataView(buffer);
      if (view.byteLength < 16) { resolve(result); return; }
      var b0 = view.getUint8(0), b1 = view.getUint8(1), b2 = view.getUint8(2), b3 = view.getUint8(3);
      if (b0 === 0xFF && b1 === 0xD8) {
        result.format = "JPEG";
        var offset = 2;
        while (offset < view.byteLength - 4) {
          if (view.getUint8(offset) !== 0xFF) { offset++; continue; }
          var marker = view.getUint8(offset + 1);
          if (marker === 0xD8 || marker === 0xD9) { offset += 2; continue; }
          if (marker === 0xDA) break;
          var len = view.getUint16(offset + 2, false);
          if (marker === 0xE1) {
            var exifStart = offset + 4;
            if (view.getUint32(exifStart, false) === 0x45786966) {
              result.hasMetadata = true;
              result.exif = parseExifIFD(view, exifStart + 6);
            }
          }

            if (offset + 9 <= view.byteLength) {
              var h = view.getUint16(offset + 5, false);
              var w = view.getUint16(offset + 7, false);
              result.dimensions = { width: w, height: h };
            }
          }
          offset += 2 + len;
        }
      } else if (b0 === 0x89 && b1 === 0x50 && b2 === 0x4E && b3 === 0x47) {
        result.format = "PNG";
        var off = 8;
        while (off < view.byteLength - 8) {
          var len2 = view.getUint32(off, false);
          if (len2 > view.byteLength) break;
          var chunkType = String.fromCharCode(view.getUint8(off+4), view.getUint8(off+5), view.getUint8(off+6), view.getUint8(off+7));
          if (chunkType === "IHDR" && off + 16 <= view.byteLength) {
            var w2 = view.getUint32(off + 8, false);
            var h2 = view.getUint32(off + 12, false);
            result.dimensions = { width: w2, height: h2 };

          if (chunkType === "c2pa" || chunkType === "C2PA") result.hasC2PA = true;
          off += 8 + len2 + 4;
        }
      } else if (view.byteLength > 12 && view.getUint32(0, false) === 0x52494646 && view.getUint32(8, false) === 0x57454250) {

      }

function parseExifIFD(view, start) {
  var exif = {};
  try {
    var endian = view.getUint16(start, false) === 0x4949 ? "le" : "be";
    var ifdOffset = view.getUint32(start + 4, endian === "le");
    var ifdStart = start + ifdOffset;
    var entries = view.getUint16(ifdStart, endian === "le");
    if (entries > 200) entries = 200;
    for (var i = 0; i < entries; i++) {
      var e = ifdStart + 2 + i * 12;
      if (e + 12 > view.byteLength) break;
      var tag = view.getUint16(e, endian === "le");
      var type = view.getUint16(e + 2, endian === "le");
      var count = view.getUint32(e + 4, endian === "le");
      var valueOffset = e + 8;
      var val = readExifValue(view, type, count, valueOffset, endian, start);
      var named = EXIF_TAGS[tag];
      if (named) exif[named] = val;
    }
    for (var j = 0; j < entries; j++) {
      var e2 = ifdStart + 2 + j * 12;
      if (e2 + 12 > view.byteLength) break;
      var tag2 = view.getUint16(e2, endian === "le");
      if (tag2 === 0x8825) {
        var gpsOffset = view.getUint32(e2 + 8, endian === "le");
        exif.gps = readGPS(view, start + gpsOffset, endian);
      }
    }
  } catch (e) {}
  return exif;
}

function readExifValue(view, type, count, offset, endian, baseOffset) {
  try {
    var size = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 }[type] || 0;
    var total = size * count;
    var dataOffset = total <= 4 ? offset : baseOffset + view.getUint32(offset, endian === "le");
    if (type === 2) {
      var s = "";
      for (var i = 0; i < count; i++) { var c = view.getUint8(dataOffset + i); if (c === 0) break; s += String.fromCharCode(c); }
      return s;
    }
    if (type === 3) return view.getUint16(dataOffset, endian === "le");
    if (type === 4) return view.getUint32(dataOffset, endian === "le");
    if (type === 5) { var num = view.getUint32(dataOffset, endian === "le"); var den = view.getUint32(dataOffset + 4, endian === "le"); return den ? (num / den) : num; }
    if (type === 10) { var num2 = view.getInt32(dataOffset, endian === "le"); var den2 = view.getInt32(dataOffset + 4, endian === "le"); return den2 ? (num2 / den2) : num2; }
    return null;
  } catch (e) { return null; }
}

function readGPS(view, gpsStart, endian) {
  var gps = {};
  try {
    var entries = view.getUint16(gpsStart, endian === "le");
    if (entries > 50) entries = 50;
    var vals = {};
    for (var i = 0; i < entries; i++) {
      var e = gpsStart + 2 + i * 12;
      if (e + 12 > view.byteLength) break;
      var tag = view.getUint16(e, endian === "le");
      var type = view.getUint16(e + 2, endian === "le");
      var count = view.getUint32(e + 4, endian === "le");
      var off = e + 8;
      var dataOff = (type === 5 || type === 10) && count > 1 ? gpsStart + view.getUint32(off, endian === "le") : off;
      if (type === 2) { var s = ""; for (var k = 0; k < count; k++) { var c = view.getUint8(dataOff + k); if (c === 0) break; s += String.fromCharCode(c); } vals[tag] = s; }
      else if (type === 5 && count === 3) {
        var v1 = view.getUint32(dataOff, endian === "le") / (view.getUint32(dataOff+4, endian==="le") || 1);
        var v2 = view.getUint32(dataOff+8, endian === "le") / (view.getUint32(dataOff+12, endian==="le") || 1);
        var v3 = view.getUint32(dataOff+16, endian === "le") / (view.getUint32(dataOff+20, endian==="le") || 1);
        vals[tag] = [v1, v2, v3];
      }
    }
    if (vals[1] && vals[2]) {
      var lat = vals[1][0] + vals[1][1]/60 + vals[1][2]/3600;
      if (vals[3] === "S") lat = -lat;

      if (vals[4] === "W") lon = -lon;

}

function computePerceptualHash(img) {
  return new Promise(function (resolve) {
    try {
      var c = document.createElement("canvas"); c.width = 8; c.height = 8;
      var ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, 8, 8);
      var data = ctx.getImageData(0, 0, 8, 8).data;
      var gray = []; var sum = 0;
      for (var i = 0; i < data.length; i += 4) { var g = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114); gray.push(g); sum += g; }

      var bits = "";
      for (var j = 0; j < gray.length; j++) bits += (gray[j] > avg ? "1" : "0");
      var hex = "";
      for (var k = 0; k < bits.length; k += 4) hex += parseInt(bits.substr(k, 4), 2).toString(16);
      resolve({ bits: bits, hex: hex.toUpperCase() });
    } catch (e) { resolve(null); }
  });
}

function performELA(img, quality) {
  return new Promise(function (resolve) {
    try {
      quality = quality || 90;
      var c = document.createElement("canvas");
      c.width = Math.min(img.naturalWidth || img.width, 800);
      c.height = Math.min(img.naturalHeight || img.height, 800);
      var ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      var origData = ctx.getImageData(0, 0, c.width, c.height);
      var dataURL = c.toDataURL("image/jpeg", quality / 100);
      var recompressed = new Image();
      recompressed.onload = function () {
        var c2 = document.createElement("canvas");
        c2.width = c.width; c2.height = c.height;
        var ctx2 = c2.getContext("2d");
        ctx2.drawImage(recompressed, 0, 0);
        var newData = ctx2.getImageData(0, 0, c.width, c.height);
        var out = ctx.createImageData(c.width, c.height);
        var totalDiff = 0, maxDiff = 0, cnt = 0;
        for (var i = 0; i < origData.data.length; i += 4) {
          var r = Math.abs(origData.data[i] - newData.data[i]);
          var g = Math.abs(origData.data[i+1] - newData.data[i+1]);
          var b = Math.abs(origData.data[i+2] - newData.data[i+2]);
          var d = (r + g + b) / 3;
          totalDiff += d; if (d > maxDiff) maxDiff = d; cnt++;
          out.data[i] = Math.min(255, r * 15);
          out.data[i+1] = Math.min(255, g * 15);
          out.data[i+2] = Math.min(255, b * 15);
          out.data[i+3] = 255;
        }
        ctx2.putImageData(out, 0, 0);
        var avgDiff = totalDiff / cnt;
        resolve({ avgDiff: avgDiff, maxDiff: maxDiff, suspicious: avgDiff > 8 || maxDiff > 80, dataURL: c2.toDataURL("image/png") });
      };
      recompressed.onerror = function () { resolve(null); };
      recompressed.src = dataURL;
    } catch (e) { resolve(null); }
  });
}

function scoreRing(score, label) {
  var r = 54, c = 2 * Math.PI * r, dash = c * (score / 100);
  var color = score >= 70 ? "var(--success)" : score >= 40 ? "var(--warning)" : "var(--danger)";
  return '<div class="score-ring"><svg width="130" height="130" viewBox="0 0 140 140">' +
    '<circle cx="70" cy="70" r="' + r + '" stroke="var(--border)" stroke-width="10" fill="none"/>' +
    '<circle cx="70" cy="70" r="' + r + '" stroke="' + color + '" stroke-width="10" fill="none" stroke-dasharray="' + dash + ' ' + c + '" stroke-linecap="round"/>' +
    '</svg><div class="sr-label"><b>' + score + '</b><span>' + esc(label || "مؤشر") + '</span></div></div>';
}

function sevClass(v) { return v === "low" ? "low" : v === "med" ? "med" : v === "high" ? "high" : "crit"; }

function computeAwarenessScore() {
  var s = 20;
  s += Math.min(Object.keys(state.lessons).length * 4, 20);
  s += Math.min(Object.keys(state.courses).length * 6, 24);
  s += Math.min(state.history.quizzes.length * 4, 16);
  var scans = state.history.scans.length + state.history.msgScans.length + state.history.emailScans.length + state.history.fileScans.length + state.history.qrScans.length + state.history.imageScans.length;
  s += Math.min(scans, 10);
  s += state.family.name ? 4 : 0;
  s += Math.min(state.family.members.length * 2, 6);
  return clamp(Math.round(s), 0, 100);
}
function computeReadiness() {
  var chk = Object.keys(state.checklists).length;
  var checkScore = Math.min(chk * 3, 30);
  var trainingScore = Math.min(Object.keys(state.courses).length * 5, 20);
  var lessonsScore = Math.min(Object.keys(state.lessons).length * 3, 15);
  var accScore = 0, devScore = 0, privScore = 0;
  for (var k in state.checklists) {
    if (!state.checklists.hasOwnProperty(k)) continue;
    if (k.indexOf("acc_") === 0) accScore = 10;
    if (k.indexOf("dev_") === 0) devScore = 10;
    if (k.indexOf("priv_") === 0) privScore = 10;
  }
  var famScore = state.family.members.length ? 5 : 0;
  return clamp(Math.round(checkScore + trainingScore + lessonsScore + accScore + devScore + privScore + famScore), 0, 100);
}

/* Real AI call */
async function callRealAI(userMessage) {
  var cfg = state.aiConfig;
  if (!cfg.enabled || !cfg.apiKey || !cfg.endpoint) throw new Error("AI not configured");
  var history = [];
  // Include system prompt
  history.push({ role: "system", content: cfg.systemPrompt || "أنت مساعد أمان الأسرة." });
  history.push({ role: "user", content: userMessage });

  var body = {
    model: cfg.model || "gpt-4o-mini",
    messages: history,
    temperature: cfg.temperature != null ? cfg.temperature : 0.7,
    max_tokens: cfg.maxTokens || 600
  };

  var res = await fetch(cfg.endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + cfg.apiKey
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    var errText = "";
    try { errText = await res.text(); } catch (e) {}
    throw new Error("HTTP " + res.status + (errText ? ": " + errText.substring(0, 200) : ""));
  }
  var data = await res.json();
  if (data.choices && data.choices[0] && data.choices[0].message) return data.choices[0].message.content;
  if (data.choices && data.choices[0] && data.choices[0].text) return data.choices[0].text;
  if (data.message && data.message.content) return data.message.content;
  if (data.content) return data.content;
  throw new Error("Unexpected response format");
}

function appendChatMsg(who, text, isTyping) {
  var box = $("#chatBox"); if (!box) return null;
  var el = document.createElement("div");
  el.className = "ai-msg " + (who === "user" ? "user" : "bot");
  var whoIcon = who === "user" ? "👤" : "🤖";
  if (isTyping) {
    el.innerHTML = '<div class="who">' + whoIcon + '</div><div class="bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div>';
  } else {
    el.innerHTML = '<div class="who">' + whoIcon + '</div><div class="bubble">' + esc(text) + '</div>';
  }
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}

async function sendChatMessage() {
  var input = $("#chatInput");
  var text = (input.value || "").trim();
  if (!text) return;
  input.value = "";
  appendChatMsg("user", text);
  var typing = appendChatMsg("bot", "", true);

  var ready = state.aiConfig && state.aiConfig.enabled && state.aiConfig.apiKey;
  if (ready) {
    try {
      var response = await callRealAI(text);
      typing.remove();
      appendChatMsg("bot", response);
      return;
    } catch (e) {
      typing.remove();
      appendChatMsg("bot", "⚠️ تعذر الاتصال بالمساعد الذكي: " + e.message + "\n\nسأستخدم المساعد المحلي:\n\n" + assistantLocalAnswer(text));
      return;
    }
  }
  // Local fallback
  setTimeout(function () {
    typing.remove();
    appendChatMsg("bot", assistantLocalAnswer(text));
  }, 300);
}

    var title = $("#evTitle").value.trim();
    if (!title) { toast("أدخل عنوانًا", "warn"); return; }
    var fileInput = $("#evFile");
    var file = fileInput && fileInput.files ? fileInput.files[0] : null;
    var entry = { id: uid(), title: title, type: $("#evType").value, description: $("#evDesc").value.trim(), link: $("#evLink").value.trim(), fileName: file ? file.name : "", hash: "", createdAt: Date.now() };
    if (file) {

        entry.hash = h || "";

      });

      state.evidence.push(entry); saveState(); closeModal(); toast("تم", "success"); render();
    }
  };

function exportEvidenceReport() {

  var lines = ["تقرير أدلة — أمان الأسرة", "التاريخ: " + fmtDateTime(Date.now()), "العدد: " + items.length, ""];
  for (var i = 0; i < items.length; i++) {

    if (e.hash) lines.push("SHA-256: " + e.hash);

  }
  download("aman-evidence-" + Date.now() + ".txt", lines.join("\n"));
  toast("تم", "success");
}

function startQuiz(kind) {
  var qs = QUIZZES[kind]; var idx = 0, correct = 0;
  function next() {
    if (idx >= qs.length) return finish();
    var q = qs[idx];
    var body = '<p style="font-size:15px;font-weight:600;margin-bottom:14px">' + esc(q.q) + '</p>';
    body += '<div style="display:flex;flex-direction:column;gap:8px" id="quizOpts">';
    for (var i = 0; i < q.a.length; i++) body += '<button class="btn" data-opt="' + i + '" style="justify-content:flex-start;text-align:right">' + esc(q.a[i]) + '</button>';
    body += '</div><div id="quizFb" style="margin-top:14px"></div>';
    openModal({ title: "سؤال " + (idx + 1) + " / " + qs.length, body: body });
    var opts = $("#quizOpts");
    if (opts) opts.onclick = function (e) {
      var btn = e.target.closest("[data-opt]"); if (!btn) return;
      var i = +btn.dataset.opt;
      var all = $$("#quizOpts button");
      for (var j = 0; j < all.length; j++) all[j].disabled = true;
      if (i === q.correct) correct++;
      var ok = i === q.correct;
      var fb = $("#quizFb");
      if (fb) fb.innerHTML = '<div class="banner ' + (ok ? "success" : "warn") + '"><span>' + (ok ? "✅" : "💡") + '</span><div><b>' + (ok ? "صحيح!" : "الصحيح: " + esc(q.a[q.correct])) + '</b><br>' + esc(q.why) + '</div></div>' +
        '<button class="btn btn-primary" id="quizNext">' + (idx + 1 < qs.length ? "التالي →" : "النتيجة") + '</button>';
      var nb = $("#quizNext");
      if (nb) nb.onclick = function () { idx++; closeModal(); setTimeout(next, 200); };
    };
  }
  function finish() {
    var pct = Math.round((correct / qs.length) * 100);
    state.history.quizzes.push({ kind: kind, correct: correct, total: qs.length, at: Date.now() });
    saveState();
    openModal({
      title: "النتيجة",
      body: '<div style="text-align:center;margin:16px 0"><div style="font-size:44px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">' + pct + '%</div>' +
        '<div class="muted">' + correct + ' / ' + qs.length + '</div></div>',
      footer: '<button class="btn btn-primary" data-modal-close>تم</button>'
    });
    render();
  }
  next();
}

function dohQuery(name, type) {
  var url = API_CONFIG.dnsLookup.endpoint + "?name=" + encodeURIComponent(name) + "&type=" + type;
  return fetch(url, { headers: { "Accept": "application/dns-json" } }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}
function renderDomainResult(name) {
  var root = $("#domainResult"); if (!root) return;
  root.innerHTML = '<div class="card"><p class="muted small">جارٍ...</p></div>';
  var types = ["A", "AAAA", "MX", "TXT", "NS"];
  var results = {};
  var chain = Promise.resolve();
  types.forEach(function (t) { chain = chain.then(function () { return dohQuery(name, t).then(function (d) { results[t] = d; }).catch(function (e) { results[t] = { error: e.message }; }); }); });
  chain.then(function () {
    var html = '<div class="card"><h3>' + esc(name) + '</h3>';
    types.forEach(function (t) {
      var d = results[t];
      html += '<div class="kv" style="align-items:flex-start"><b>' + t + '</b><div style="flex:1;text-align:left">';
      if (!d || d.error) html += '<span class="muted small">—</span>';
      else if (!d.Answer || !d.Answer.length) html += '<span class="muted small">لا سجلات</span>';
      else d.Answer.forEach(function (a) { html += '<div class="mono small">' + esc(a.data) + '</div>'; });
      html += '</div></div>';
    });
    html += '</div>';
    root.innerHTML = html;
  });
}

function runDiagnostics() {
  var results = [];
  function test(name, fn) {
    try { var r = fn(); results.push({ name: name, status: r === true ? "PASS" : (r === false ? "FAIL" : "INFO"), msg: typeof r === "string" ? r : "" }); }
    catch (e) { results.push({ name: name, status: "FAIL", msg: e.message }); }
  }
  test("DOM", function () { return !!$("#view"); });
  test("LocalStorage", function () { return storageOK ? true : "ذاكرة مؤقتة"; });
  test("IndexedDB", function () { return MediaStore.isAvailable() ? true : "غير متاح"; });
  test("Web Crypto", function () { return !!(window.crypto && crypto.subtle); });
  test("BarcodeDetector", function () { return "BarcodeDetector" in window ? true : "غير مدعوم"; });
  test("Owner Mode", function () { return state.owner.enabled ? "مفعّل" : "غير مفعّل"; });
  test("AI Assistant", function () { return (state.aiConfig && state.aiConfig.enabled && state.aiConfig.apiKey) ? "جاهز" : "غير مفعّل (يستخدم المساعد المحلي)"; });
  test("Cloudflare DoH", function () { return API_CONFIG.dnsLookup.endpoint; });
  test("HIBP", function () { return API_CONFIG.hibpPassword.endpoint; });
  var html = '<div class="card">';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var chip = r.status === "PASS" ? "success" : r.status === "FAIL" ? "danger" : "info";
    html += '<div class="kv"><b>' + esc(r.name) + '</b><span><span class="chip ' + chip + '">' + r.status + '</span>' + (r.msg ? ' <span class="muted small">' + esc(r.msg) + '</span>' : '') + '</span></div>';
  }
  html += '</div>';
  var root = $("#diagResults"); if (root) root.innerHTML = html;
}

function attachViewEvents(viewId) {
  var heads = $$("[data-acc-head], [data-art-head], [data-guide-head], [data-faq-head]");
  for (var h = 0; h < heads.length; h++) (function (h_) { h_.onclick = function () { h_.parentElement.classList.toggle("open"); }; })(heads[h]);

  /* ===== OWNER ADMIN ===== */
  if (viewId === "adminPanel" && isOwnerUnlocked()) {
    // Load current logo preview
    MediaStore.get("logo").then(function (blob) {
      var preview = $("#logoPreviewIcon");
      if (blob && preview) {
        var url = URL.createObjectURL(blob);
        preview.innerHTML = "";
        preview.style.background = "none";
        var img = document.createElement("img");
        img.src = url;
        img.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:inherit";
        preview.appendChild(img);
      }
    });
    // Load current bg preview
    MediaStore.get("bg").then(function (blob) {
      var prev = $("#bgPreview");
      if (!prev) return;

function importData(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function (ev) {
    try {
      var parsed = JSON.parse(ev.target.result);
      var data = parsed.data || parsed;
      if (!data || typeof data !== "object") throw new Error("bad");
      confirmModal({ title: "استيراد", message: "سيتم استبدال البيانات.", confirmText: "استيراد", danger: true,
        onConfirm: function () { state = migrate(data); saveState(); applyTheme(); toast("تم", "success"); navigate("home", { skipHistory: true }); } });
    } catch (err) { toast("ملف غير صالح", "error"); }
  };
  reader.readAsText(file); e.target.value = "";
}

}

var COMMANDS = [
  { ico: "🤖", title: "المساعد الذكي", run: function () { navigate("assistant"); } },
  { ico: "🛡️", title: "مركز الحماية", run: function () { navigate("protectCenter"); } },
  { ico: "🖼️", title: "تحليل صورة", run: function () { navigate("imageForensics"); } },
  { ico: "🔗", title: "فحص رابط", run: function () { navigate("link"); } },
  { ico: "💬", title: "تحليل رسالة", run: function () { navigate("msg"); } },
  { ico: "🚨", title: "فحص التسريبات", run: function () { navigate("breachCheck"); } },
  { ico: "🇪🇬", title: "الجهات المصرية", run: function () { navigate("egyptOfficial"); } },
  { ico: "🌙", title: "تبديل الثيم", run: toggleTheme }
];
function openCommandPalette() {
  var root = $("#cmdkRoot"); if (!root) return;
  root.innerHTML = '<div class="cmdk"><div class="cmdk-input-wrap"><span>🔍</span><input class="cmdk-input" id="cmdkInput" placeholder="ابحث..." autofocus/></div><div class="cmdk-list" id="cmdkList"></div><div class="cmdk-foot"><span><kbd>Esc</kbd></span></div></div>';
  root.classList.add("show");
  var inp = $("#cmdkInput"), list = $("#cmdkList");
  var filtered = COMMANDS.slice();
  function draw() {
    var html = "";
    for (var i = 0; i < filtered.length; i++) html += '<div class="cmdk-item" data-i="' + i + '"><div class="ci">' + filtered[i].ico + '</div><div>' + esc(filtered[i].title) + '</div></div>';
    list.innerHTML = html;
    var its = $$(".cmdk-item");
    for (var j = 0; j < its.length; j++) (function (el) { el.onclick = function () { run(+el.dataset.i); }; })(its[j]);
  }
  function run(i) { var c = filtered[i]; if (!c) return; closeCmdk(); try { c.run(); } catch (e) {} }
  inp.oninput = function () {
    var q = inp.value.trim().toLowerCase();
    filtered = q ? COMMANDS.filter(function (c) { return c.title.toLowerCase().indexOf(q) >= 0; }) : COMMANDS.slice();
    draw();
  };
  draw();
  setTimeout(function () { inp.focus(); }, 50);
}
function closeCmdk() { var root = $("#cmdkRoot"); if (!root) return; root.classList.remove("show"); setTimeout(function () { if (!root.classList.contains("show")) root.innerHTML = ""; }, 200); }

function openProfile() {
  openModal({
    title: "الملف الشخصي",
    body: '<div style="text-align:center;margin-bottom:16px"><div style="font-size:52px">👤</div><div style="font-weight:800;margin-top:6px">' + (state.family.name ? esc(state.family.name) : "مستخدم") + '</div></div>' +
      '<div class="kv"><b>الجاهزية</b><span>' + computeReadiness() + ' / 100</span></div>' +
      '<div class="kv"><b>وضع المالك</b><span>' + (state.owner.enabled ? "مفعّل" : "غير مفعّل") + '</span></div>' +
      '<div class="kv"><b>حالات</b><span>' + state.cases.length + '</span></div>' +
      '<div class="kv"><b>أدلة</b><span>' + state.evidence.length + '</span></div>',
    footer: (isOwnerUnlocked() ? '<button class="btn btn-primary" data-goto="adminPanel">👑 لوحة المالك</button>' : '') + '<button class="btn" data-goto="settings">الإعدادات</button>'
  });
  setTimeout(function () { var gs = $$("[data-goto]"); for (var i = 0; i < gs.length; i++) (function (b) { b.onclick = function () { closeModal(); navigate(b.dataset.goto); }; })(gs[i]); }, 50);
}
function openEmergency() {
  var opts = [
    { ico: "🔓", txt: "حساب مخترق", w: "hacked" }, { ico: "🚨", txt: "ابتزاز", w: "extortion" },
    { ico: "💳", txt: "احتيال", w: "scam" }, { ico: "📱", txt: "سرقة هاتف", w: "stolen" },
    { ico: "👶", txt: "طفل في خطر", w: "child" }, { ico: "📞", txt: "مكالمة احتيالية", w: "phone" },
    { ico: "⚠️", txt: "تهديد", w: "threat" }, { ico: "🖼️", txt: "صورة مشبوهة", w: "image" }
  ];
  var body = '<div class="banner danger"><span>⚠️</span><div>خطر جسدي؟ 122. جرائم إلكترونية: 108.</div></div><div class="grid grid-2" style="gap:8px">';
  for (var i = 0; i < opts.length; i++) body += '<button class="btn" data-emg="' + opts[i].w + '" style="justify-content:flex-start;text-align:right;padding:13px"><span style="font-size:19px">' + opts[i].ico + '</span> ' + esc(opts[i].txt) + '</button>';
  body += '</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-danger" href="tel:108">📞 108</a><a class="btn" href="tel:16000">📞 16000</a></div>';
  openModal({ title: "🚨 مساعدة الآن", body: body });
  var bs = $$("[data-emg]");
  for (var j = 0; j < bs.length; j++) (function (b) {
    b.onclick = function () { closeModal(); navigate("wizard"); setTimeout(function () { renderWizardStep(b.dataset.emg); }, 120); };
  })(bs[j]);
}

function initHistoryTrap() {
  if (!window.history || !history.pushState) return;
  try { history.replaceState({ __aman: true, view: state.currentView }, "", ""); history.pushState({ __aman: true, view: state.currentView }, "", ""); } catch (e) {}
  window.addEventListener("popstate", function (e) {
    if (e.state && e.state.__aman && e.state.view) {
      if (state.currentView !== e.state.view) { state.currentView = e.state.view; saveState(); render(); closeSidebar(); window.scrollTo(0, 0); }
    } else {
      if (state.currentView !== "home") { state.currentView = "home"; saveState(); render(); closeSidebar(); window.scrollTo(0, 0); }
      try { history.pushState({ __aman: true, view: state.currentView }, "", ""); } catch (e) {}
    }
  });
}

function init() {
  try {
    applyTheme();
    if (state.childMode) document.body.classList.add("child-mode");
    if (state.seniorMode) document.body.classList.add("senior");
    if (state.colorBlindMode && state.colorBlindMode !== "off") document.body.classList.add("cb-" + state.colorBlindMode);
    buildNav(); render(); updateNotifDot(); initHistoryTrap();
    applyBranding();
    bindOwnerTrigger();
  } catch (err) {
    var el = $("#view"); if (el) el.innerHTML = '<div class="bootstrap-error">تعذر: ' + esc(err.message || "") + '</div>';
    return;
  }

  var mt = $("#menuToggle"); if (mt) mt.onclick = function () { var s = $("#sidebar"); if (s && s.classList.contains("open")) closeSidebar(); else openSidebar(); };
  var scb = $("#sidebarCloseBtn"); if (scb) scb.onclick = closeSidebar;
  var so = $("#sidebarOverlay"); if (so) so.onclick = closeSidebar;

  document.body.addEventListener("click", function (e) {
    var nav = e.target.closest ? e.target.closest("[data-nav]") : null;
    if (nav) { e.preventDefault(); navigate(nav.dataset.nav); return; }
    var nc = e.target.closest ? e.target.closest("[data-new-case]") : null;
    if (nc) { e.preventDefault(); addCaseModal(nc.dataset.newCase); return; }
  });

  var bb = $("#backBtn"); if (bb) bb.onclick = goBack;
  var tb = $("#themeBtn"); if (tb) tb.onclick = toggleTheme;
  var nb = $("#notifBtn"); if (nb) nb.onclick = openNotifications;
  var pb = $("#profileBtn"); if (pb) pb.onclick = openProfile;
  var sb = $("#searchBtnMobile"); if (sb) sb.onclick = openCommandPalette;
  var ef = $("#emergencyFab"); if (ef) ef.onclick = openEmergency;
  var sm = $("#searchMini"); if (sm) sm.onclick = openCommandPalette;

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCommandPalette(); return; }
    if (e.key === "Escape") closeCmdk();
  });
  var cmk = $("#cmdkRoot"); if (cmk) cmk.onclick = function (e) { if (e.target === cmk) closeCmdk(); };

  if (!state.notifications.some(function (n) { return n.type === "welcome"; })) {
    addNotification({ type: "welcome", ico: "👋", title: "مرحبًا", body: "الإصدار 5.0: وضع المالك، AI حقيقي، وخلفيات ديناميكية." });
  }
  if (!storageOK) toast("ذاكرة مؤقتة", "warn", 5000);
  window.addEventListener("online", function () { toast("عاد الاتصال", "success"); });
  window.addEventListener("offline", function () { toast("لا اتصال", "warn"); });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else setTimeout(init, 0);

})();
</script>
</body>
</html>
